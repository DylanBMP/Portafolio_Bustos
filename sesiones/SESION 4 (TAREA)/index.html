<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gran Sorteo 2026</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <h1>GRAN SORTEO CANASTA 2026</h1>
    <div class="formulario">
        <form action="">
            <p><b>Apellidos y Nombres: </b></p>
            <input type="text" placeholder="Ingresa tus datos">
            <br>
            <p><b>Dirección: </b></p>
            <input type="text" placeholder="Ingresa tu dirección">
            <br>
            <p><b>Edad: </b></p>
            <input type="number" placeholder="Ingresa tu edad">
            <br>
            <p><b>Correo Electrónico: </b></p>
            <input type="email" placeholder="Ingresa tu correo lectrónico">
            <br>
            <p><b>Sexo: </b></p>
            <input type="radio" name="sexo">Masculino
            <input type="radio" name="sexo">Femenino
            <br>
            <br>
            <p><b>Distrito: </b></p>
            <select name="distrito" id="">
                <option>------------</option>
                <option>El Angustino</option>
                <option>La Molina</option>
                <option>San Isidro</option>
                <option>Ate</option>
                <option>San Juan de Miraflores</option>
                <option>San Juan de Lurigancho</option>
            </select>
            <p>Dejanos tu comentario: </p>
            <textarea name="" id="" cols="30" rows="10"></textarea>
            <br>
            <input type="submit" value="Enviar">
        </form>
    </div>
</body>
</html>
